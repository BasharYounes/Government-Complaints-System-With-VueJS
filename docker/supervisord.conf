[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid


[program:apache]
command=/usr/local/bin/apache2-foreground
autostart=true
autorestart=true

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=90 --memory=128 --no-interaction

directory=/var/www/html
user=www-data

autostart=true
autorestart=true

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0